<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ifk - Minimal Shooter (Three.js)</title>
  <style>
    html,body{height:100%;margin:0;background:#202124;color:#eee;font-family:sans-serif}
    #canvas{display:block;width:100%;height:100vh}
    #hud{position:absolute;left:10px;top:10px;z-index:10}
    #players{position:absolute;right:10px;top:10px;max-width:320px;background:rgba(0,0,0,0.35);padding:8px;border-radius:6px;z-index:10}
    button { padding:8px 12px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div>Click anywhere to lock pointer. Press Esc to unlock.</div>
    <div>Yaw: <span id="yaw">0</span> Pitch: <span id="pitch">0</span></div>
    <div><button id="shoot">Shoot (click or press Space)</button></div>
  </div>
  <div id="players"><strong>Players</strong><div id="playersList"></div></div>

  <!-- Three.js from CDN -->
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="/client.js"></script>
</body>
</html>
